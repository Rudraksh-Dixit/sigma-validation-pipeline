[project]
name = "sigma-validation-pipeline"
version = "0.1.0"
description = "CI/CD pipeline for automatic Sigma detection rule validation against Wazuh SIEM"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "sigma-cli>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "docker>=7.0.0",
    "jinja2>=3.1.0",
    "mitreattack-python>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
