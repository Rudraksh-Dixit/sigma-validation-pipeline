version: '3.8'

services:
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.0
    hostname: wazuh-manager
    ports:
      - "55000:55000"
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
    environment:
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=wazuh-wui
    volumes:
      - ./config/wazuh/ossec.conf:/wazuh-config-mount/etc/ossec.conf
      - wazuh_manager_data:/var/ossec/data
    healthcheck:
      test: curl -sk https://localhost:55000/?pretty || exit 1
      interval: 15s
      timeout: 10s
      retries: 20

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.9.0
    hostname: wazuh-dashboard
    ports:
      - "5601:5601"
    environment:
      - WAZUH_API_URL=https://wazuh-manager
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=wazuh-wui
    depends_on:
      wazuh-manager:
        condition: service_healthy

volumes:
  wazuh_manager_data:
